<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>University Management System - Admin Panel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto Mono', 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
            background-color: #323437;
            color: #d1d0c5;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: #2c2e31;
            border: 1px solid #3c3e41;
            border-radius: 8px;
            padding: 32px;
            max-width: 560px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }

        .title {
            color: #e2b714;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        p {
            color: #646669;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .btn {
            display: inline-block;
            background-color: #e2b714;
            color: #2c2e31;
            padding: 10px 18px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            transition: background-color 0.15s ease;
        }

        .btn:hover {
            background-color: #f0c422;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="title">Admin Control Panel</div>
    <p>
        System administrator view. Role-based access control grants you complete CRUD permissions over administrators, teachers, and students.
    </p>
    <a href="/dashboard" class="btn">Return to Dashboard</a>
</div>

</body>
</html>
