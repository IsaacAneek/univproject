services:
  postgres:
    image: postgres:17
    container_name: univproject-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: univdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d univdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: univproject-container
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/univdb
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "org.springframework.boot.ignore=true"

volumes:
  postgres_data:
